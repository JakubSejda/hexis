# Hexis CI — mirrors the local pre-push hook (typecheck → lint → vitest)
# so regressions surface on every PR instead of only on a developer's
# machine with a drifted clock (see the date time-bomb incidents: #19,
# #23, and the PR-3 drive-by fix).
#
# The suite talks to TWO MySQL schemas on one service container:
#   DATABASE_URL      → hexis       (api/* integration tests bind @/db/client)
#   TEST_DATABASE_URL → hexis_test  (login-flow/xp/session-auto-finish connect directly)
# dotenv in src/tests/setup.ts never overrides pre-set env vars, so
# job-level env is enough — no .env.local needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: hexis
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/hexis
      TEST_DATABASE_URL: mysql://root:ci@127.0.0.1:3306/hexis_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # Node 25 matches local dev (lockfile is generated by its bundled
      # npm 11; npm 10 on older Node rejects it over optional platform deps).
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test schema
        run: mysql -h 127.0.0.1 -uroot -pci -e "CREATE DATABASE IF NOT EXISTS hexis_test;"

      - name: Prepare storage root
        run: mkdir -p uploads

      - name: Migrate dev schema
        run: npm run db:migrate

      # heatmap/muscle-rank/volume-progress integration tests expect the
      # seeded muscle_groups + exercises catalog in the dev schema.
      - name: Seed dev schema
        run: npm run db:seed

      - name: Migrate test schema
        run: DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run
